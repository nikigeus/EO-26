backend:
  name: github
  repo: nikigeus/EO-26
  branch: main

# ВСЕ картинки хранятся в папке images
media_folder: "images"
public_folder: "/images"

collections:
  - name: "settings"
    label: "Настройки сайта"
    files:
      - name: "general"
        label: "Общие настройки"
        file: "data/site.json"
        fields:
          # Ссылки на трансляции
          - { label: "Ссылка: Основная сцена", name: "link_main", widget: "string" }
          - { label: "Ссылка: Зал 1", name: "link_hall1", widget: "string" }
          - { label: "Ссылка: Зал 2", name: "link_hall2", widget: "string" }

          # Ссылки на баннеры
          - { label: "Ссылка: Баннер 1", name: "banner_link1", widget: "string" }
          - { label: "Ссылка: Баннер 2", name: "banner_link2", widget: "string" }
          - { label: "Ссылка: Баннер 3", name: "banner_link3", widget: "string" }

          # Картинки баннеров
          - { label: "Картинка: Баннер 1", name: "banner_img1", widget: "image", required: false }
          - { label: "Картинка: Баннер 2", name: "banner_img2", widget: "image", required: false }
          - { label: "Картинка: Баннер 3", name: "banner_img3", widget: "image", required: false }

          # Порядок секций
          - label: "Порядок секций"
            name: "section_order"
            widget: "list"
            fields:
              - { label: "ID секции", name: "id", widget: "select", options: ["live", "schedule", "program", "partners", "distract", "useful", "about", "team", "faq"] }

          # Расписание
          - label: "Расписание"
            name: "schedule"
            widget: "object"
            fields:
              - label: "Основная сцена"
                name: "0"
                widget: "list"
                fields:
                  - { label: "Начало", name: "start", widget: "string" }
                  - { label: "Конец", name: "end", widget: "string" }
                  - { label: "Тема", name: "title", widget: "string" }
                  - { label: "Подпись", name: "sub", widget: "string", required: false }
              - label: "Зал 1"
                name: "1"
                widget: "list"
                fields:
                  - { label: "Начало", name: "start", widget: "string" }
                  - { label: "Конец", name: "end", widget: "string" }
                  - { label: "Тема", name: "title", widget: "string" }
                  - { label: "Подпись", name: "sub", widget: "string", required: false }
              - label: "Зал 2"
                name: "2"
                widget: "list"
                fields:
                  - { label: "Начало", name: "start", widget: "string" }
                  - { label: "Конец", name: "end", widget: "string" }
                  - { label: "Тема", name: "title", widget: "string" }
                  - { label: "Подпись", name: "sub", widget: "string", required: false }
